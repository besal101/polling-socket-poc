x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
  depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: postgres }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, retries: 15 }
  redis: { image: "redis:7-alpine" }
  app1: *app
  app2: *app
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app1, app2]
